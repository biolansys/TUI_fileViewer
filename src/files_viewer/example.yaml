app:
  name: Files Viewer TUI
  version: "1.0"
  environment: development
viewer:
  max_render_rows: 500
  max_render_cols: 50
  enable_markdown_preview: true
  supported_formats:
    table: [csv, tsv, parquet, orc, avro, xlsx]
    text: [txt, md, log, yaml, json, xml, html]
paths:
  data_dir: ./data
  output_dir: ./output
